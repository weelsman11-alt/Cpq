/* Layout: Waimea Blue app bar with tabs; working canvas on brand light grey; configure = builder + sticky price rail; quote = form + paper preview */
:root{
  --blue:#1462AC; --blue-2:#3184BD; --navy:#193159; --grey-d:#787678; --grey-m:#969696;
  --bg:#f4f4f4; --surface:#ffffff; --surface-2:#eef2f7; --line:#dde2e9; --ink:#231F20; --ink-2:#5f5d5f;
  --accent:#1462AC; --accent-soft:#e3edf7; --on-accent:#ffffff; --bar:#1462AC; --bar-2:#0f5294;
  --ok:#2e7d4f; --ok-soft:#e2f2e8; --warn:#9a6a00; --warn-soft:#fbf1d9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --paper:#ffffff; --paper-ink:#231F20;
  --f:'Gibson',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1626; --surface:#15213a; --surface-2:#1b2a47; --line:#26385a; --ink:#eef2f8; --ink-2:#a9b4c6;
  --accent:#5aa2dc; --accent-soft:#1b3352; --on-accent:#0b1424; --bar:#193159; --bar-2:#122644;
  --ok:#6fcf97; --ok-soft:#173528; --warn:#e9c46a; --warn-soft:#3a3018; --bad:#ff8a80; --bad-soft:#3d1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1626; --surface:#15213a; --surface-2:#1b2a47; --line:#26385a; --ink:#eef2f8; --ink-2:#a9b4c6;
  --accent:#5aa2dc; --accent-soft:#1b3352; --on-accent:#0b1424; --bar:#193159; --bar-2:#122644;
  --ok:#6fcf97; --ok-soft:#173528; --warn:#e9c46a; --warn-soft:#3a3018; --bad:#ff8a80; --bad-soft:#3d1c1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;margin:0}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-top{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.bar-top img{height:44px;width:auto}
.bar-top .app-name{border-left:1px solid rgba(255,255,255,.35);padding-left:16px;display:flex;flex-direction:column}
.app-name b{font-weight:700;font-size:17px;letter-spacing:.01em}
.app-name span{font-size:12px;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.bar-top .who{margin-left:auto;font-size:13px;opacity:.9}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{appearance:none;background:none;border:0;color:#fff;opacity:.78;font:600 14px var(--f);padding:10px 14px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.tabs button:hover{opacity:1}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:#fff}
nav.tabs .count{background:rgba(255,255,255,.2);border-radius:10px;padding:0 7px;font-size:12px}
main{padding-block:24px 48px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--warn);padding:10px 14px;border-radius:var(--r);margin-bottom:18px;font-size:14px}
.banner.info{background:var(--accent-soft);border-left-color:var(--accent)}
h2{font-size:22px;font-weight:700;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.grid-cfg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.grid-quote{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:920px){.grid-cfg,.grid-quote{grid-template-columns:minmax(0,1fr)}}
.models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:28px}
@media (max-width:560px){.models{grid-template-columns:minmax(0,1fr)}}
.model{appearance:none;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.model:hover{border-color:var(--blue-2)}
.model[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.model .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.model .name{font-weight:700;font-size:18px}
.model .chassis{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.model .price{font-weight:600}
.model .desc{font-size:13px;color:var(--ink-2)}
.opt-group{margin-bottom:22px}
.opt-group h3{margin-bottom:8px}
.opt-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.opt{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.opt:first-child{border-top:0}
.opt input{width:18px;height:18px;accent-color:var(--blue);flex:none}
.opt .lbl{flex:1;min-width:0}
.opt .p{font-weight:600}
.opt.on{background:var(--accent-soft)}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:920px){.rail{position:static}}
.rail .head{background:var(--navy);color:#fff;padding:14px 16px}
.rail .head .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.rail .head .v{font-size:18px;font-weight:700}
.rail .body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;gap:12px}
.row.sub{font-size:13px;color:var(--ink-2)}
.row.total{border-top:1px solid var(--line);padding-top:10px;font-weight:700;font-size:18px}
.rail .lines{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible,.model:focus-visible{outline:2px solid var(--blue-2);outline-offset:1px}
.btn{appearance:none;font:600 14px var(--f);border-radius:4px;padding:10px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 10px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card + .card{margin-top:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.two{grid-template-columns:minmax(0,1fr)}}
.pd{display:flex;gap:8px;align-items:flex-end}
.pd .field{flex:1}
.pd-note{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey-m);flex:none}
.dot.on{background:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
/* Paper preview: A4 pages, always light, mirrors the PDF */
.paper-wrap{display:flex;flex-direction:column;gap:16px;overflow-x:auto}
.paper{background:#fff;color:#231F20;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.08);min-width:520px;padding:18px 40px 16px;font-size:11.5px;line-height:1.45;color-scheme:light;display:flex;flex-direction:column;min-height:740px}
.paper p{margin:0 0 7px}.paper p.tight{margin:0 0 2px}
.paper .pghd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.paper .pghd img{width:70px}.paper .pghd img.tp{width:110px}
.paper .pt{margin:12px 0 4px;color:#1462AC;font-size:15px;font-weight:400}
.paper .pgbody>.pt:first-child{margin-top:0}
.paper h5{margin:10px 0 3px;color:#1462AC;font-size:12px}
.paper ul{margin:0 0 7px;padding-left:20px}
.paper table.spec{width:100%;border-collapse:collapse;font-size:11px}
.paper table.spec td{border:1px solid #000;padding:2px 5px;vertical-align:top}
.paper table.spec .r{text-align:right}.paper table.spec .c{text-align:center}
.paper table.spec tr.sec td:first-child{background:#1462AC;color:#fff;font-weight:700}.paper table.spec td.g{background:#eee}
.paper table.spec tr.mh td:not(:first-child){font-weight:700}
.paper table.spec tr.cat td{background:#1462AC;color:#fff}
.paper table.spec tr.tot td{background:#1462AC;color:#fff;font-weight:700}
.paper table.spec.fin{margin:4px 0}.paper table.spec.fin tr.sec td{background:#1462AC;color:#fff;font-weight:700}
.paper .fnote{font-size:10px;color:#787678}
.paper .sig{display:flex;flex-direction:column;gap:22px;margin-top:22px;font-size:10px;text-transform:uppercase}
.paper .sig div{display:flex;gap:6px;align-items:flex-end}.paper .sig span{white-space:nowrap}.paper .sig i{flex:1;border-bottom:1px solid #000}.paper .sig em{flex:1}
.paper .terms{font-size:9px;line-height:1.35}.paper .terms h5.t1{font-size:12px}.paper .terms h6{margin:6px 0 2px;color:#1462AC;font-size:10px}.paper .terms p{margin:0 0 1px}.paper .terms p.c1{padding-left:6px}.paper .terms p.c2{padding-left:14px}
.paper .pgbody{flex:1}
.paper .pf{margin-top:14px;text-align:right;padding-right:60px;font-size:11px}
.paper.cover{padding-top:40px}
.paper .cv{display:flex;flex-direction:column;align-items:center;text-align:center}
.paper .cvlogo{width:300px;margin-bottom:70px}
.paper .cvq{font-size:24px;line-height:1.35}
.paper .cvm{margin-top:24px;font-size:18px;display:flex;flex-direction:column;gap:8px}
.paper .cvband{align-self:stretch;height:16px;background:#eee;margin:40px -24px 16px}
.paper .cv3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-self:stretch;font-size:11px}.paper .cv3 div{display:flex;flex-direction:column;gap:5px}
.opt .qty{width:64px;padding:5px 6px}
.opt label.lbl{cursor:pointer}
.sp-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 120px auto;gap:8px;align-items:end}

table.q{width:100%;border-collapse:collapse;min-width:820px}
table.q th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
table.q td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}

table.q td.r,table.q th.r{text-align:right}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:10px;padding:2px 9px;white-space:nowrap}
.chip.saved{background:var(--surface-2);color:var(--ink-2)}
.chip.pushed{background:var(--ok-soft);color:var(--ok)}
.chip.ex{background:var(--warn-soft);color:var(--warn)}
.qno{font-weight:700;color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{max-width:320px}

table.pb{width:100%;border-collapse:collapse;min-width:760px}
table.pb th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
table.pb td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.pb input,table.pb select{padding:7px 8px}
.applies{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.applies label{display:flex;gap:4px;align-items:center;white-space:nowrap}
.fin-toggles{display:flex;flex-wrap:wrap;gap:8px}
.fin-toggles label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;background:var(--surface)}
.fin-toggles label.on{border-color:var(--accent);background:var(--accent-soft)}
.fin-toggles input{accent-color:var(--blue);width:16px;height:16px}
.fin-panel{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.fin-panel .fh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.fin-panel .fh b{font-size:15px}
.fin-panel .fh .amt{font-weight:700;color:var(--accent)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chk{display:flex;gap:7px;align-items:center;font-size:14px}

<script>
/* Netlify runtime: provides the same claude.use('db' | 'user' | 'downloads') API the app was written against,
   backed by Netlify Functions (/api/store) and plain browser downloads. Pipedrive goes through /api/pipedrive. */
window.CPQ_PIPEDRIVE = true;
(function(){
  const POLL_MS = 8000;
  const adminKey = () => { try { return localStorage.getItem('cpq-admin-key') || ''; } catch(e){ return ''; } };
  async function api(method, params, body){
    const url = '/api/store' + (params ? '?' + new URLSearchParams(params) : '');
    const send = () => fetch(url, { method, headers: { 'content-type':'application/json', 'x-admin-key': adminKey() }, body: body ? JSON.stringify(body) : undefined });
    let r = await send();
    if (r.status === 403) {
      const k = window.prompt('Enter the price book admin key to save changes:');
      if (k) { try { localStorage.setItem('cpq-admin-key', k); } catch(e){} r = await send(); }
    }
    if (!r.ok) { const e = new Error('Request failed: ' + r.status); e.code = r.status === 403 ? 'permission_denied' : 'error'; throw e; }
    return r.status === 204 ? null : r.json();
  }
  const watchers = new Set();
  function refreshAll(){ watchers.forEach(w => w()); }
  function docRef(path){
    return {
      id: path.split('/').pop(),
      async set(data){ await api('PUT', { path }, { data, merge:false }); refreshAll(); },
      async update(data){ await api('PUT', { path }, { data, merge:true }); refreshAll(); },
      async delete(){ await api('DELETE', { path }); refreshAll(); },
      onSnapshot(next, onErr){
        let last = null, stop = false;
        const tick = async () => { if (stop) return; try { const r = await api('GET', { path }); const s = JSON.stringify(r);
            if (s !== last) { last = s; next({ exists: !!(r && r.data), data: () => r && r.data, id: path.split('/').pop() }); } } catch(e){ onErr && onErr(e); } };
        tick(); const t = setInterval(tick, POLL_MS); watchers.add(tick);
        return () => { stop = true; clearInterval(t); watchers.delete(tick); };
      }
    };
  }
  function collRef(name, order){
    return {
      orderBy(field, dir){ return collRef(name, { field, dir }); },
      async add(data){ const r = await api('POST', { collection:name }, { data }); refreshAll(); return { id: r.id }; },
      onSnapshot(next, onErr){
        let last = null, stop = false;
        const tick = async () => { if (stop) return; try { const r = await api('GET', { collection:name }); let docs = r.docs || [];
            if (order) docs.sort((a,b) => { const x=a.data[order.field]||'', y=b.data[order.field]||''; return (x<y?-1:x>y?1:0) * (order.dir==='desc'?-1:1); });
            const s = JSON.stringify(docs); if (s !== last) { last = s; next({ docs: docs.map(d => ({ id:d.id, data:() => d.data })) }); } } catch(e){ onErr && onErr(e); } };
        tick(); const t = setInterval(tick, POLL_MS); watchers.add(tick);
        return () => { stop = true; clearInterval(t); watchers.delete(tick); };
      }
    };
  }
  const db = { doc: docRef, collection: n => collRef(n) };
  const user = {
    async id(){ let id=''; try{ id=localStorage.getItem('cpq-uid'); if(!id){ id='u_'+Math.random().toString(36).slice(2,12); localStorage.setItem('cpq-uid',id); } }catch(e){} return id; },
    async me(){ return { name: '' }; },
    canEdit(){ return true; }
  };
  const downloads = { async save({ filename, data }){ const url = URL.createObjectURL(data); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); } };
  window.claude = { use: async name => ({ db, user, downloads })[name] || null };
})();
</script>

const AUD = new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',minimumFractionDigits:2,maximumFractionDigits:2});
const AUD0 = new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',minimumFractionDigits:0,maximumFractionDigits:0});
const money = n => AUD.format(Math.round((+n||0)*100)/100);
const money0 = n => AUD0.format(Math.round(+n||0));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
function dmy(iso){ if(!iso) return ''; const d=iso instanceof Date?iso:new Date(iso+'T00:00:00'); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function addDaysISO(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+(+n||0)); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3400); }
function parseLines(txt){ return String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const i=l.indexOf(':'); return i<0?[l,'']:[l.slice(0,i).trim(),l.slice(i+1).trim()]; }); }
function linesToText(arr){ return (arr||[]).map(([k,v])=>v?`${k}: ${v}`:k).join('\n'); }
function fill(tpl, vars){ return String(tpl||'').replace(/\{(\w+)\}/g,(m,k)=>vars[k]!==undefined&&vars[k]!==''?vars[k]:m); }

const FIN_TYPES=[{id:'outright',label:'Outright Purchase'},{id:'r2o',label:'Rent to Own'},{id:'finlease',label:'Finance Lease'},{id:'oplease',label:'Operating Lease'},{id:'rental',label:'Rental'}];
const FIN_DEFAULTS={
  outright:{depositPct:30, progressPct:20},

  outright:[['depositPct','Deposit (%)'],['progressPct','Progress payment (%)']],
  r2o:[['fu','Financial Unit (FU)'],['minTerm','Minimum rental (months)'],['maxTerm','Full rental term (months)'],['creditPct','Rental credited to purchase (%)']],
  finlease:[['term','Term (months)'],['rate','Rate p.a. (%)'],['depositPct','Deposit (%)'],['balloonPct','Balloon (%)']],
  oplease:[['term','Term (months)'],['rate','Rate p.a. (%)'],['residualPct','Residual (%)']],

};

function finDefaults(id){ return Object.assign({},FIN_DEFAULTS[id],(S.pb&&S.pb.finance&&S.pb.finance[id])||{}); }
/* Financial Unit: monthly rental per $1,000 of price ex GST (35 FU = $35 per $1,000 a month). Older saves stored a % of price. */
function fuOf(c){ return c.fu!==undefined&&c.fu!==''?(+c.fu||0):(+c.ratePct||0)*10; }
/* Rental FU steps down with term: under 24 months fuBase (35), 24-35 months fu24 (30), 36+ months fu36 (25). A FU typed on the quote overrides until the term changes. */
function rentalFu(c){ if(c.fuManual&&c.fu!==''&&c.fu!==undefined) return +c.fu||0; const t=Math.round(+c.term||0), d=FIN_DEFAULTS.rental;
  const b=+(c.fuBase??d.fuBase), f24=+(c.fu24??d.fu24), f36=+(c.fu36??d.fu36); return t>=36?f36:t>=24?f24:b; }
function pmt(amount,ratePA,n,fv,advance){ n=Math.max(1,Math.round(+n||1)); const r=(+ratePA||0)/1200; fv=+fv||0; if(!r) return (amount-fv)/n; const f=Math.pow(1+r,n); const p=(amount-fv/f)*r/(1-1/f); return advance?p/(1+r):p; }
function calcFinance(id,c,ex,rate,texts){
  const label=(FIN_TYPES.find(t=>t.id===id)||{}).label||id;
  const g=n=>Math.round(n*rate*100)/100, ov=+c.override>0?+c.override:0, term=Math.max(1,Math.round(+c.term||0));
  if(id==='outright'){
    const dp=+c.depositPct||0, pp=+c.progressPct||0, bp=Math.max(0,100-dp-pp);
    return {id,label,headline:money(ex),period:'+ GST',lines:[
      [`Deposit ${dp}% (within 7 days of signed order)`,money(ex*dp/100)],
      [`Progress payment ${pp}% (when build enters production)`,money(ex*pp/100)],
      [`Balance ${bp}% (on commissioning, prior to delivery)`,money(ex*bp/100)]],
      note:'All amounts exclude GST. GST is payable with each instalment.', text:''};
  }
  if(id==='r2o'){
    const m=ov||ex*fuOf(c)/1000, mn=Math.round(+c.minTerm||6), mx=Math.round(+c.maxTerm||12), cr=+c.creditPct||0;
    const buyAt=k=>Math.max(0,ex-m*k*cr/100);
    return {id,label,headline:money(m),period:'per month + GST',lines:[
      ['Monthly rental ex GST',money(m)],['Minimum rental term',mn+' months'],['Purchase window',`Month ${mn} to ${mx}`],
      ['Rental credited to purchase',cr+'%'],[`Purchase price at month ${mn}`,money(buyAt(mn))],[`Purchase price at month ${mx}`,money(buyAt(mx))]],
      note:'Fully maintained rental. Purchase prices exclude GST.', text:fill((texts&&texts.r2o)||'',{min:mn,max:mx,credit:cr})};
  }
  if(id==='rental'){
    const m=ov||ex*rentalFu(c)/1000;
    return {id,label,headline:money(m),period:'per month + GST',lines:[['Monthly rental ex GST',money(m)],['Weekly equivalent ex GST',money(m*12/52)],['Minimum term',term+' months'],['GST per month',money(g(m))]],note:'Fully maintained. Subject to availability. The unit remains Waimea property.',text:''};
  }
  if(id==='finlease'){
    const dep=ex*(+c.depositPct||0)/100, bal=ex*(+c.balloonPct||0)/100, fin=ex-dep, m=ov||pmt(fin,c.rate,term,bal,!!c.advance);
    return {id,label,headline:money(m),period:'per month + GST',lines:[['Amount financed',money(fin)],['Deposit',money(dep)],['Term',term+' months'],['Rate p.a.',(+c.rate||0)+'%'],['Balloon at end',money(bal)],['Payments',c.advance?'In advance':'In arrears']],note:'Indicative only. Subject to credit approval and final terms.',text:''};
  }
  if(id==='oplease'){
    const res=ex*(+c.residualPct||0)/100, m=ov||pmt(ex,c.rate,term,res,!!c.advance);
    return {id,label,headline:money(m),period:'per month + GST',lines:[['Term',term+' months'],['Monthly rental ex GST',money(m)],['Maintenance',c.maint?'Included':'Not included'],['At end of term','Return unit to Waimea']],note:'No ownership at end of term. Indicative only. Subject to credit approval.',text:''};
  }
}

const models=()=> (S.pb&&S.pb.models)||[];
const modelById=id=> models().find(m=>m.id===id);
const optionsFor=mid=> ((S.pb&&S.pb.options)||[]).filter(o=>!o.models||!o.models.length||o.models.includes(mid));
const gstRate=()=> S.pb&&typeof S.pb.gstRate==='number'?S.pb.gstRate:0.10;
const texts=()=> (S.pb&&S.pb.text)||{};
function qtyOf(o){ const q=S.draft.qty&&S.draft.qty[o.id]; return Math.max(1, Math.round(+(q!==undefined&&q!==''?q:(o.qty||1))||1)); }
function calcDraft(){
  const m=modelById(S.draft.modelId);
  const opts=m?optionsFor(m.id).filter(o=>S.draft.optionIds.includes(o.id)).map(o=>({id:o.id,name:o.name,category:o.category||'Accessories',price:+o.price||0,qty:qtyOf(o)})):[];
  const specials=(S.draft.specials||[]).filter(x=>String(x.desc||'').trim()).map(x=>({name:x.desc,qty:Math.max(1,+x.qty||1),price:+x.price||0}));
  const ov=S.draft.base, base=m?(ov!=null&&ov!==''?+ov||0:+m.base||0):0;
  const optTotal=opts.reduce((a,o)=>a+o.price*o.qty,0), spTotal=specials.reduce((a,o)=>a+o.price*o.qty,0);
  const subtotal=base+optTotal+spTotal, discount=Math.max(0,+S.draft.discount||0), ex=subtotal-discount, rate=gstRate();
  return {model:m||null,options:opts,specials,base,optTotal,spTotal,subtotal,discount,ex,gst:Math.round(ex*rate*100)/100,total:ex+Math.round(ex*rate*100)/100,rate};
}
function defaultNumber(){ const d=new Date((S.draft.date||todayISO())+'T00:00:00'); return pad(d.getDate())+pad(d.getMonth()+1); }

function richText(t){ // lines starting "• " become bullets; "Heading" lines (no full stop, short) become sub-headings
  const out=[]; let ul=null;
  String(t||'').split('\n').forEach(l=>{ const s=l.trim(); if(!s){ if(ul){out.push(`<ul>${ul.join('')}</ul>`); ul=null;} return; }

  if(ul) out.push(`<ul>${ul.join('')}</ul>`); return out.join('');

  const act=e.target.closest('[data-act]');

    if(act.dataset.act==='pdf') return downloadPdf(q);
    if(act.dataset.act==='open') return openQuote(q);
    if(act.dataset.act==='push') return pushToPipedrive(q, act);

  if(S.armed&&!e.target.closest('[data-act]')){ S.armed=null; if(S.tab==='saved') render(); }

  if(id==='pb-addm'){ S.pbEdit.models.push({id:'model-'+Date.now().toString(36),name:'New model',chassis:'',base:0,description:'',title:'',code:'',equipment:[],vehicle:[],turnkey:'',inclusions:''}); render(); return; }

document.addEventListener('change',e=>{

  if(t.dataset.opt){ const id=t.dataset.opt; S.draft.optionIds=t.checked?[...new Set([...S.draft.optionIds,id])]:S.draft.optionIds.filter(x=>x!==id); persistDraft(); render(); const n=$('#qty-'+CSS.escape(id))||$('#opt-'+CSS.escape(id)); n&&n.focus(); return; }
  if(t.dataset.fon){ const id=t.dataset.fon; S.draft.finance=S.draft.finance||{}; if(t.checked) S.draft.finance[id]=Object.assign(finDefaults(id),S.draft.finance[id]||{},{on:true}); else if(S.draft.finance[id]) S.draft.finance[id].on=false; persistDraft(); $('#fin-card').innerHTML=vFinance(); renderPaper(); return; }
  if(t.dataset.fflag){ S.draft.finance[t.dataset.fflag][t.dataset.k]=t.checked; persistDraft(); updFin(); return; }
  if(t.dataset.qflag){ S.draft[t.dataset.qflag]=t.checked; persistDraft(); renderPaper(); return; }

function keepFocus(fn){ const a=document.activeElement, id=a&&a.id, pos=a&&a.selectionStart; fn(); if(id){ const n=document.getElementById(id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } } }
document.addEventListener('input',e=>{

  if(t.id==='base-price'){ S.draft.base=t.value; persistDraft(); keepFocus(()=>$('#rail').innerHTML=vRail()); return; }
  if(t.id==='discount'){ S.draft.discount=+t.value||0; persistDraft(); keepFocus(()=>$('#rail').innerHTML=vRail()); return; }

  if(t.dataset.p){ S.draft.prep[t.dataset.p]=t.value; persistDraft(); renderPaper(); return; }
  if(t.dataset.q){ S.draft[t.dataset.q]=t.value; persistDraft(); if(t.dataset.q==='date'){ const n=$('#q-number'); n&&(n.placeholder=defaultNumber()); } renderPaper(); return; }
  if(t.dataset.sp!==undefined){ S.draft.specials[+t.dataset.sp][t.dataset.k]=t.value; persistDraft(); renderPaper(); return; }

    persistDraft(); updFin(); return; }
  if(t.id==='search'){ S.search=t.value; keepFocus(render); return; }
  if(t.dataset.pbm!==undefined){ const m=S.pbEdit.models[+t.dataset.pbm]; m[t.dataset.k]=t.dataset.k==='base'?(+t.value||0):t.value; return; }
  if(t.dataset.pbml!==undefined){ S.pbEdit.models[+t.dataset.pbml][t.dataset.k]=parseLines(t.value); return; }
  if(t.dataset.pbo!==undefined){ const o=S.pbEdit.options[+t.dataset.pbo]; o[t.dataset.k]=(t.dataset.k==='price'||t.dataset.k==='qty')?(+t.value||0):t.value; return; }

  if(t.dataset.pbt){ S.pbEdit.text[t.dataset.pbt]=t.value; return; }

function writeErr(err){ const c=err&&err.code; if(c==='permission_denied'||c==='not_granted') return "You don't have permission to change this. Ask the page owner for access."; return 'Couldn’t save just now. Check your connection and try again.'; }

function newQuote(){ const prep=Object.assign({},S.draft.prep); S.draft=blankDraft(); S.draft.prep=prep; S.editingId=null; persistDraft(); go('configure'); }
function openQuote(q){
  S.editingId=q.id;
  const qty={}; (q.options||[]).forEach(o=>qty[o.id]=o.qty||1);
  S.draft=Object.assign(blankDraft(),{modelId:q.model&&q.model.id, base:q.model&&q.model.base!=null?q.model.base:null, optionIds:(q.options||[]).map(o=>o.id), qty, discount:q.discount||0,
    dealId:q.dealId||'', number:q.number||'', client:Object.assign(blankDraft().client,q.client||{}), prep:Object.assign(blankDraft().prep,q.prep||{}),
    finance:Object.fromEntries((q.finance||[]).map(f=>[f.id,Object.assign({},f.config,{on:true})])),
    specials:(q.specials||[]).map(x=>({desc:x.name,qty:x.qty,price:x.price})), showPrices:!!q.showPrices,
    validDays:q.validDays||30, completion:q.completion||'', notes:q.notes||'', date:q.date||todayISO()});
  persistDraft(); go('quote');
  if(q.model&&!modelById(q.model.id)) toast('This model is no longer in the price book. Prices will update when you change the build.');
}
async function saveQuote(){
  if(!S.db) return toast('Sign in to claude.ai to save quotes.');
  if(!calcDraft().model) return toast('Pick a model first.');
  if(!S.draft.client.company.trim()){ $('#c-company').focus(); return toast('Add the client company before saving.'); }
  const btn=$('#btn-save'); btn.disabled=true;
  try{
    const now=new Date().toISOString(); const rec=buildQuote();
    if(S.quotes.some(x=>x.number===rec.number&&x.id!==S.editingId)){ let k=2; while(S.quotes.some(x=>x.number===rec.number+'-'+k)) k++; rec.number=rec.number+'-'+k; S.draft.number=rec.number; }
    if(S.editingId){ await S.db.doc('quotes/'+S.editingId).update(Object.assign(rec,{updatedAt:now})); }
    else { const ref=await S.db.collection('quotes').add(Object.assign(rec,{createdAt:now,updatedAt:now,createdBy:S.uid||null,pipedrive:null})); S.editingId=ref.id; }
    S.draft.number=rec.number; persistDraft(); toast(`Saved quote ${rec.number}`); render();
  }catch(err){ toast(writeErr(err)); } finally{ const b=$('#btn-save'); if(b) b.disabled=false; }
}
async function savePricebook(){
  const pb=S.pbEdit, ids=new Set();
  for(const m of pb.models){ if(!String(m.name).trim()) return toast('Every model needs a name.'); if(!m.id) m.id=slug(m.name); if(ids.has(m.id)) m.id=m.id+'-'+Date.now().toString(36); ids.add(m.id); }
  for(const o of pb.options){ if(!String(o.name).trim()) return toast('Every module needs a name.'); o.models=(o.models||[]).filter(id=>ids.has(id)); }
  try{ await S.db.doc('config/pricebook').set(Object.assign({},pb,{updatedAt:new Date().toISOString()})); toast('Price book saved'); }catch(err){ toast(writeErr(err)); }
}

function makePdf(q){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'}); let F='helvetica';
  try{ doc.addFileToVFS('gr.ttf',TTF_REG); doc.addFont('gr.ttf','Gibson','normal'); doc.addFileToVFS('gb.ttf',TTF_BOLD); doc.addFont('gb.ttf','Gibson','bold'); doc.setFont('Gibson','normal'); F='Gibson'; }catch(e){}
  const W=210,H=297,M=22,CW=W-2*M,BLUE=[20,98,172],LBLUE=[49,132,189],INK=[35,31,32],GREY=[120,118,120],LIGHT=[238,238,238],WHITE=[255,255,255],BOT=272;
  const font=(w,s,c)=>{ doc.setFont(F,w); doc.setFontSize(s); doc.setTextColor(...(c||INK)); };
  const clean=s=>String(s??'').replace(/−/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/×/g,'x');
  let y=0;
  const header=()=>{ doc.addImage(LOGO_MAIN,'PNG',M,9,22,22*0.44); doc.addImage(LOCKUP,'PNG',W-M-34,11,34,34*81/480); y=31; };
  const newPage=()=>{ doc.addPage(); header(); };
  const ensure=h=>{ if(y+h>BOT) newPage(); };
  const heading=(t,size=12.5)=>{ ensure(14); y+=2; font('normal',size,BLUE); doc.text(clean(t),M,y); y+=5.2; };
  const textBlock=(t,{size=9.5,col=INK,w='normal',x=M,width=CW,gap=2.4,indent=0}={})=>{ if(!t) return; String(t).split(/\n{2,}/).forEach(pp=>{
      pp.split('\n').forEach(line=>{ font(w,size,col); const lines=doc.splitTextToSize(clean(line),width-indent); const lh=size*0.44;
        lines.forEach(l=>{ if(y+lh>BOT){ newPage(); font(w,size,col); } doc.text(l,x+indent,y); y+=lh; }); });
      y+=gap; }); };
  const rich=(t,size=9.5)=>{ const lh=size*0.44; let lastBlank=false;
    String(t||'').split('\n').forEach(raw=>{ const s=raw.trim(); if(!s){ y+=2.4; lastBlank=true; return; }
      if(s.startsWith('• ')){ font('normal',size); const ls=doc.splitTextToSize(clean(s.slice(2)),CW-8); ls.forEach((l,i)=>{ if(y+lh>BOT){ newPage(); font('normal',size);} if(i===0) doc.text('•',M+2,y); doc.text(l,M+7,y); y+=lh; }); }
      else if(isSubHead(s)){ ensure(10); if(!lastBlank) y+=1.5; font('bold',size+0.5,BLUE); doc.text(clean(s),M,y); y+=lh+0.8; }
      else { font('normal',size); doc.splitTextToSize(clean(s),CW).forEach(l=>{ if(y+lh>BOT){ newPage(); font('normal',size);} doc.text(l,M,y); y+=lh; }); }
      lastBlank=false; }); y+=2; };

  /* bordered table: cols = widths in mm; cells = [{t, align, bold, color}] ; opts.fill, opts.fillRight */
  const LH=3.55, PADY=0.55;
  const tRow=(cols,cells,o={})=>{
    font(o.bold?'bold':'normal',8.6,o.color||INK);
    const wrapped=cells.map((c,i)=>c&&c.t!==undefined?doc.splitTextToSize(clean(c.t),cols[i]-3):[]);
    const h=Math.max(1,...wrapped.map(w=>w.length))*LH+PADY*2;
    if(y+h>BOT){ newPage(); if(o.onBreak) o.onBreak(); }
    let x=M;
    cols.forEach((cw,i)=>{ const fill=o.fills?o.fills[i]:o.fill; if(fill){ doc.setFillColor(...fill); doc.rect(x,y,cw,h,'F'); }
      doc.setDrawColor(0,0,0); doc.setLineWidth(0.2); doc.rect(x,y,cw,h);
      const c=cells[i]; if(c&&c.t!==undefined){ font(c.bold||o.bold?'bold':'normal',8.6,c.color||o.color||INK);
        wrapped[i].forEach((l,j)=>{ const ty=y+PADY+LH*(j+1)-0.8; if(c.align==='r') doc.text(l,x+cw-1.5,ty,{align:'right'}); else if(c.align==='c') doc.text(l,x+cw/2,ty,{align:'center'}); else doc.text(l,x+1.5,ty); }); }
      x+=cw; });
    y+=h; };
  const merge=(cols,a,b)=>{ const out=cols.slice(0,a); out.push(cols.slice(a,b+1).reduce((s,v)=>s+v,0)); return out.concat(cols.slice(b+1)); };

  // ---- page 1: cover
  const c=q.client,p=q.prep,m=q.model;
  doc.addImage(LOGO_MAIN,'PNG',W/2-58,30,116,116*0.44);
  y=128; font('normal',22); doc.text('Quotation for:',W/2,y,{align:'center'}); y+=10;
  doc.splitTextToSize(clean(c.company||''),CW).forEach(l=>{ doc.text(l,W/2,y,{align:'center'}); y+=10; });
  y+=6; font('bold',17); doc.text('Model Presented:',W/2,y,{align:'center'}); y+=11;
  font('normal',17); doc.splitTextToSize(clean(m.title),CW).forEach(l=>{ doc.text(l,W/2,y,{align:'center'}); y+=8; });
  y=Math.max(y+12,194); doc.setFillColor(...LIGHT); doc.rect(12,y,W-24,7,'F'); y+=13;
  const colX=[W/2-60,W/2,W/2+60];
  const cvCol=(x,lines)=>{ let yy=y; lines.forEach((l,i)=>{ font(i===0?'bold':'normal',9.5); doc.splitTextToSize(clean(l),58).forEach(s=>{ doc.text(s,x,yy,{align:'center'}); yy+=6; }); }); };
  cvCol(colX[0],[`Quote ${q.number}`,'Date Submitted:',dmy(q.date),`Valid for ${q.validDays} days`]);
  cvCol(colX[1],['Prepared for:',[c.contact,c.company].filter(Boolean).join(' of '),c.phone||'',c.email||'']);
  cvCol(colX[2],['Prepared by:',p.name||'',p.phone||'',p.email||'']);

  // ---- page 2: build specifications table
  newPage(); heading('Quote and Build Specifications',13); y-=2.5;
  const C3=[CW*0.6,CW*0.17,CW*0.23], C2=merge(C3,1,2);
  tRow(C2,[{t:m.title},{t:m.code,align:'r'}]);
  if(m.equipment&&m.equipment.length){ tRow(C2,[{t:'Equipment',bold:true,color:WHITE},{t:''}],{fills:[BLUE,LIGHT]}); m.equipment.forEach(([k,v])=>tRow(C2,[{t:k},{t:v,align:'r'}])); }
  if(m.turnkey) tRow(C2,[{t:m.turnkey},{t:''}]);
  if(m.vehicle&&m.vehicle.length){ tRow(C2,[{t:'Vehicle',bold:true,color:WHITE},{t:''}],{fills:[BLUE,LIGHT]}); m.vehicle.forEach(([k,v])=>tRow(C2,[{t:k+(/costs|duty/i.test(k)?':':'')},{t:v,align:'r'}])); }
  if(m.inclusions) tRow(C2,[{t:m.inclusions},{t:''}]);
  const modHead=()=>tRow(C3,[{t:'Modules:'},{t:'Qty',align:'c',bold:true},{t:'Total Price',align:'r',bold:true}]);
  modHead();
  const cat=g=>tRow(C3,[{t:g+':',color:WHITE},{t:'-',align:'c',color:WHITE},{t:'-',align:'r',color:WHITE}],{fill:BLUE,onBreak:modHead});
  const item=(n,qty,v)=>tRow(C3,[{t:n},{t:String(qty),align:'c'},{t:v,align:'r'}],{onBreak:modHead});
  const groups={}; (q.options||[]).forEach(o=>(groups[o.category||'Accessories']||=[]).push(o));
  Object.entries(groups).forEach(([g,os])=>{ cat(g); os.forEach(o=>item(o.name,o.qty,q.showPrices?money(o.price*o.qty):'Included')); });
  cat('Customer Special Requests'); (q.specials||[]).forEach(o=>item(o.name,o.qty,(q.showPrices||o.price)?money(o.price*o.qty):'Included'));
  if(q.discount) item('Discount','',`-${money(q.discount)}`);
  tRow(merge(C3,0,1).concat([]),[{t:'Turnkey Build Total (Excl GST)',bold:true,color:WHITE},{t:money(q.ex),align:'r',bold:true,color:WHITE}],{fill:BLUE});

  // ---- notes page
  newPage(); heading('Notes'); textBlock(q.text.notes); if(q.notes) textBlock(q.notes);
  y+=3; heading('Availability Information'); textBlock(q.text.availability);
  finSections(q).forEach(f=>{ y+=3; ensure(40); heading(f.label); if(f.text) textBlock(f.text,{gap:1.2});
    y+=1; const F2=[CW*0.6,CW*0.4];
    tRow(F2,[{t:'Pricing',bold:true,color:WHITE},{t:`${f.headline} ${f.period}`,align:'r',bold:true,color:WHITE}],{fill:BLUE});
    f.lines.forEach(([k,v])=>tRow(F2,[{t:k},{t:v,align:'r'}]));
    if(f.note){ y+=3.5; textBlock(f.note,{size:8,col:GREY}); } else y+=3; });
  y+=3; heading('Quote Conditions'); textBlock(q.text.conditions,{gap:0.3});
  y+=3; heading('Quote Validity'); textBlock(q.text.validity);
  y+=3; ensure(26); heading('Payment Terms'); paymentLines(q).forEach(l=>textBlock(l,{gap:0.3}));

  // ---- warranty + acceptance
  newPage(); heading('Warranty'); rich(q.text.warranty,10);
  y+=4; heading('Acceptance of Quote'); textBlock(q.text.acceptance,{size:10});
  y+=10; ensure(40);
  const sig=(label,x,x2)=>{ font('normal',8,INK); doc.text(label.toUpperCase(),x,y); const w=doc.getTextWidth(label.toUpperCase()); doc.setDrawColor(0,0,0); doc.setLineWidth(.2); doc.line(x+w+1.5,y+0.4,x2,y+0.4); };
  sig('Signature',M,M+70); sig('Authorised signatory name',M+72,W-M); y+=12;
  sig('Authorised signatory position',M,M+120); sig('Date',M+122,W-M); y+=12;
  sig('Purchase order number',M,M+95);

  // ---- product support
  if(q.text.support){ newPage(); heading('Waimea Lifecycle Product Support',13); rich(q.text.support,9); }

  // ---- terms of trade
  if(q.text.terms){ newPage(); heading('Terms of Trade',13);
    String(q.text.terms).split('\n').forEach(raw=>{ const s=raw.trim(); if(!s) return;
      if(s.startsWith('# ')){ ensure(12); y+=2.5; font('bold',11,BLUE); doc.text(clean(s.slice(2)),M,y); y+=5; return; }
      if(s.startsWith('## ')){ ensure(9); y+=1.5; font('bold',8.6,BLUE); doc.text(clean(s.slice(3)),M+1,y); y+=3.8; return; }
      const ind=/^\d+\.\d+\.\d+\./.test(s)?3:/^\([ivx]+\)/.test(s)?10:/^\(/.test(s)?6:6;
      font('normal',7.2); const ls=doc.splitTextToSize(clean(s),CW-ind); ls.forEach(l=>{ if(y+3.1>BOT){ newPage(); font('normal',7.2);} doc.text(l,M+ind,y); y+=3.1; }); });
  }

  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); font('normal',9.5,INK); doc.text('Initials___',W-M-26,H-14); }
  return doc;
}
function pdfName(q){ const d=dmy(q.date).replace(/\//g,'-'); return `${(q.client&&q.client.company)||'Customer'} - ${q.model?q.model.title:'Quote'} From Waimea Group ${d}`.replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim()+'.pdf'; }
async function downloadPdf(q){
  if(!q.model) return toast('Pick a model first.');
  if(!window.jspdf) return toast('The PDF tool didn’t load. Reload the page and try again.');
  if(!S.downloads) return toast('Downloads aren’t available in this view. Open the page on claude.ai.');
  try{ await S.downloads.save({filename:pdfName(q),data:makePdf(q).output('blob')}); toast('PDF saved'); }
  catch(err){ if(err&&err.code==='declined') return; if(err&&err.code==='rate_limited') return toast('A download is already waiting for your OK.'); toast('Couldn’t create the PDF download here.'); }
}

/* ================= Pipedrive =================
   Netlify: /api/pipedrive (window.CPQ_PIPEDRIVE). claude.ai: the viewer's Pipedrive connector through the mcp capability. */
let PD = !!window.CPQ_PIPEDRIVE, MCP = null;
const PD_VIA_MCP = () => !window.CPQ_PIPEDRIVE && !!MCP;
function pdErr(e){
  const c=e&&e.code;
  if(c==='needs_reauth') return 'Pipedrive needs reconnecting. Reconnect it in claude.ai Settings → Connectors.';
  if(c==='server_not_connected'||c==='selection_required') return 'Pipedrive isn’t connected for you. Add it in claude.ai Settings → Connectors.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required') return 'This page needs your OK to use Pipedrive. Try again and choose Allow.';
  if(c==='blocked_by_policy') return 'Your organisation’s settings block this Pipedrive action.';
  if(c==='server_unavailable') return 'Pipedrive didn’t respond. Wait a moment and try again.';
  if(c==='tool_error') return 'Pipedrive said: '+String(e.message||'request failed').slice(0,160);
  return (e&&e.message)||'Something went wrong talking to Pipedrive.';
}
async function pdTool(tool,input){ const r=await MCP.callTool('Pipedrive',tool,input,{cache:false}); const p=r.payload; if(p&&p.success===false) throw Object.assign(new Error(p.error||'Pipedrive refused the request'),{code:'tool_error'}); return (p&&p.data)!==undefined?p.data:p; }
const pdId=v=>(v&&typeof v==='object'?v.value:v)||null;
const pdPrimary=list=>(Array.isArray(list)?((list.find(x=>x&&x.primary)||list[0]||{}).value):'')||'';
function pdAddress(a){ if(!a) return ''; if(typeof a==='string') return a; return a.formatted_address||a.value||[a.street_number,a.route,a.locality,a.admin_area_level_1,a.postal_code].filter(Boolean).join(' '); }
async function pdLoad(id){
  if(!PD_VIA_MCP()){ const r=await fetch('/api/pipedrive?deal='+encodeURIComponent(id)); const j=await r.json(); if(!r.ok) throw new Error(j.error||'Not found'); return j; }
  const deal=await pdTool('getDeal',{id:+id});
  const oid=pdId(deal.org_id), pid=pdId(deal.person_id);
  const [org,person]=await Promise.all([oid?pdTool('getOrganization',{id:+oid}):null, pid?pdTool('getPerson',{id:+pid}):null]);
  return { title:deal.title||'', company:(org&&org.name)||'', address:pdAddress(org&&org.address),
    contact:(person&&person.name)||'', email:pdPrimary(person&&(person.emails||person.email)), phone:pdPrimary(person&&(person.phones||person.phone)) };
}
async function pdPush(q,note){
  if(!PD_VIA_MCP()){
    const blob=makePdf(q).output('blob'); const b64=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.onerror=rej; fr.readAsDataURL(blob); });
    const r=await fetch('/api/pipedrive',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({dealId:q.dealId,filename:pdfName(q),pdfBase64:b64,note,value:q.ex})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||'Push failed'); return {fileId:j.fileId||null, pdf:true};
  }
  await pdTool('addNote',{deal_id:+q.dealId, content:note});
  await pdTool('updateDeal',{id:+q.dealId, value:Math.round(q.ex*100)/100, currency:'AUD'});
  return {fileId:null, pdf:false};
}
function quoteNote(q){
  const lines=[`<b>Quote ${esc(q.number)}</b> (${dmy(q.date)}, valid until ${dmy(q.expiry||addDaysISO(q.date,q.validDays))})`,
    `${esc(q.model?q.model.title:'')}`, `Turnkey Build Total: <b>${money(q.ex)}</b> excl GST`];
  if((q.options||[]).length) lines.push('Modules: '+q.options.map(o=>esc(o.name)+(o.qty>1?' x'+o.qty:'')).join(', '));
  if((q.specials||[]).length) lines.push('Special requests: '+q.specials.map(o=>esc(o.name)).join(', '));
  (q.finance||[]).forEach(f=>lines.push(`${esc(f.label)}: ${esc(f.headline)} ${esc(f.period)}`));
  if(q.prep&&q.prep.name) lines.push('Prepared by '+esc(q.prep.name));
  return lines.join('<br>');
}
async function loadDeal(){
  const id=String(S.draft.dealId||'').trim(); if(!/^\d+$/.test(id)){ $('#dealId').focus(); return toast('Enter the Pipedrive deal ID (numbers only).'); }
  const b=$('#pd-load'); b.disabled=true; b.textContent='Loading…';
  try{ const j=await pdLoad(id);
    Object.assign(S.draft.client,{company:j.company||S.draft.client.company,contact:j.contact||S.draft.client.contact,email:j.email||S.draft.client.email,phone:j.phone||S.draft.client.phone,address:j.address||S.draft.client.address});
    persistDraft(); render(); toast(`Loaded ${j.company||j.title||'deal '+id}`); }
  catch(e){ toast('Couldn’t load deal '+id+'. '+pdErr(e)); const n=$('#pd-load'); if(n){ n.disabled=false; n.textContent='Load client'; } }
}
async function pushToPipedrive(q, btn){
  if(!q.dealId) return toast('Add a Pipedrive deal ID to this quote first.');
  btn.disabled=true; btn.textContent='Pushing…';
  try{
    const r=await pdPush(q, quoteNote(q));
    await S.db.doc('quotes/'+q.id).update({pipedrive:{pushedAt:new Date().toISOString(),fileId:r.fileId,pdf:r.pdf}});
    toast(r.pdf?`Quote ${q.number} and PDF added to deal #${q.dealId}`:`Quote ${q.number} added to deal #${q.dealId} as a note, and the deal value updated`);
  }catch(e){ toast('Couldn’t push to Pipedrive. '+pdErr(e)); btn.disabled=false; btn.textContent='Push to Pipedrive'; }
}

/* ================= boot ================= */
render();
(async()=>{
  const timer=setTimeout(()=>{ if(S.dbState==='loading'){ S.dbState='unavailable'; render(); } },10000);
  const [db,user,downloads]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
  S.downloads=downloads;
  if(user){ try{ S.uid=await user.id(); const me=await user.me(); S.me=(me&&me.name)||''; if(S.me){ $('#who').textContent=S.me; if(!S.draft.prep.name){ S.draft.prep.name=S.me; } } }catch(e){} try{ S.canEditPB=!!user.canEdit(); }catch(e){} }
  if(!window.CPQ_PIPEDRIVE) claude.use('mcp').then(m=>{ if(m){ MCP=m; PD=true; if(S.tab==='quote'||S.tab==='saved') keepFocus(render); } }).catch(()=>{});
  if(!db){ clearTimeout(timer); S.dbState='unavailable'; render(); return; }
  S.db=db;
  db.doc('config/pricebook').onSnapshot(snap=>{
    clearTimeout(timer); S.dbState='ready'; S.pb=snap.exists?snap.data():null;
    const typing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#main input,#main textarea');
    if(S.tab!=='pricebook'&&!typing) render(); else $('#qcount').textContent=S.quotes.length;
  },()=>{ clearTimeout(timer); S.dbState='unavailable'; render(); });
  db.collection('quotes').orderBy('createdAt','desc').onSnapshot(snap=>{ S.quotes=snap.docs.map(d=>Object.assign({id:d.id},d.data())); $('#qcount').textContent=S.quotes.length; if(S.tab==='saved') render(); },()=>{});
})();
</script>
